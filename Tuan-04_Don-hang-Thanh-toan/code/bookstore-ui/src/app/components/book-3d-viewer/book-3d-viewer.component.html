<div
  class="viewer-shell"
  [class.is-loading]="loading"
  [class.is-fallback]="fallback"
  role="group"
  [attr.aria-label]="'Trình xem 3D cho ' + title"
>
  <div #canvasHost class="canvas-host"></div>

  <span class="book-transition-target" data-book-transition-target aria-hidden="true"></span>

  <img
    #fallbackCover
    class="fallback-cover"
    [src]="fallbackCoverUrl || coverImage || originalCoverImage"
    [alt]="'Bìa sách ' + title"
    loading="eager"
    decoding="async"
    (error)="onFallbackImageError()"
  />

  <div class="cover-placeholder" *ngIf="imageUnavailable" role="img" [attr.aria-label]="'Chưa có ảnh bìa cho ' + title">
    <lucide-icon name="book-open"></lucide-icon>
    <strong>{{ title }}</strong>
  </div>

  <div class="viewer-loading" *ngIf="loading" role="status">
    <span></span>
    Đang dựng sách 3D
  </div>

  <div class="viewer-toolbar" *ngIf="!fallback && !loading">
      <span class="viewer-hint">
      <span class="hint-desktop">Kéo để xoay, cuộn để thu phóng<span *ngIf="previewEnabled"> · Nháy đúp để đọc thử</span></span>
      <span class="hint-mobile">Kéo để xoay<span *ngIf="previewEnabled"> · Nhấn Đọc thử</span></span>
    </span>
    <button type="button" (click)="resetView()" aria-label="Đưa sách về góc nhìn ban đầu">
      Đặt lại
    </button>
    <button
      *ngIf="previewEnabled"
      type="button"
      class="preview-button"
      (click)="requestPreview()"
      aria-label="Mở bản đọc thử"
    >
      Đọc thử
    </button>
  </div>

  <span class="fallback-label" *ngIf="fallback && !imageUnavailable">Chế độ xem ảnh bìa</span>
  <button
    *ngIf="fallback && previewEnabled"
    type="button"
    class="fallback-preview-button"
    (click)="requestPreview()"
  >Đọc thử</button>
</div>
