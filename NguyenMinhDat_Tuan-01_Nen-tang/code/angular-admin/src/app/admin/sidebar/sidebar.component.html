<aside class="admin-sidebar" id="accordionSidebar">
  <a class="brand" [routerLink]="['/admin/dashboard']">
    <span class="brand-mark"><i class="fas fa-book-open"></i></span>
    <span><strong>VinaBook</strong><small>Admin workspace</small></span>
  </a>

  <nav class="sidebar-nav">
    <div class="nav-group">
      <span class="group-label">Tổng quan</span>
      <a [class.active]="pageActive === 'dashboard'" [routerLink]="['/admin/dashboard']">
        <i class="fas fa-th-large"></i><span>Bảng điều khiển</span>
      </a>
    </div>

    <div class="nav-group">
      <span class="group-label">Giao diện</span>
      <a [class.active]="pageActive === 'homepage'" [routerLink]="['/admin/homepage']">
        <i class="fas fa-paint-brush"></i><span>Trang chủ</span><em>Mới</em>
      </a>
    </div>

    <div class="nav-group">
      <span class="group-label">Quản lý sách</span>
      <a [class.active]="pageActive === 'product'" [routerLink]="['/admin/product']"><i class="fas fa-book"></i><span>Sách</span></a>
      <a [class.active]="pageActive === 'category'" [routerLink]="['/admin/category']"><i class="fas fa-tags"></i><span>Thể loại</span></a>
      <a [class.active]="pageActive === 'inventory'" [routerLink]="['/admin/inventory']"><i class="fas fa-boxes"></i><span>Tồn kho</span></a>
    </div>

    <div class="nav-group">
      <span class="group-label">Bán hàng</span>
      <a [class.active]="pageActive === 'order'" [routerLink]="['/admin/order']"><i class="fas fa-shopping-bag"></i><span>Đơn hàng</span></a>
      <a [class.active]="pageActive === 'category-best-seller'" [routerLink]="['/admin/statistical-category']"><i class="fas fa-chart-pie"></i><span>Doanh thu thể loại</span></a>
      <a [class.active]="pageActive === 'soldest'" [routerLink]="['/admin/soldest']"><i class="fas fa-fire"></i><span>Sách bán chạy</span></a>
    </div>

    <div class="nav-group">
      <span class="group-label">Khách hàng</span>
      <a [class.active]="pageActive === 'customer'" [routerLink]="['/admin/customer']"><i class="fas fa-users"></i><span>Tài khoản</span></a>
      <a [class.active]="pageActive === 'rate'" [routerLink]="['/admin/rate']"><i class="fas fa-star-half-alt"></i><span>Đánh giá</span></a>
      <a [class.active]="pageActive === 'chatbot-analytics'" [routerLink]="['/admin/chatbot-analytics']"><i class="fas fa-comments"></i><span>Hiệu quả chatbot</span></a>
    </div>
  </nav>

  <div class="sidebar-note">
    <i class="fas fa-leaf"></i>
    <div><strong>Không gian quản trị</strong><span>Mọi thay đổi được đồng bộ với cửa hàng.</span></div>
  </div>
</aside>
