# Cấu hình chung. Local mặc định dùng profile dev; production phải bật profile
# prod rõ ràng để không vô tình dùng credential và JPA setting dành cho máy dev.
spring.profiles.default=dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect

# Gửi mail (quên mật khẩu, xác nhận đơn hàng). Không set MAIL_USERNAME/MAIL_PASSWORD
# thì tính năng gửi mail sẽ lỗi khi được gọi, nhưng phần còn lại của backend vẫn chạy.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

bezkoder.app.jwtExpirationMs=86400000

# Thanh toán. Không commit khóa bí mật thật; truyền qua biến môi trường khi chạy.
payment.frontend-url=${FRONTEND_URL:http://localhost:4200}
payment.backend-url=${BACKEND_PUBLIC_URL:http://localhost:8080}

# VietQR chỉ khả dụng khi có đủ ba giá trị dưới đây.
payment.bank.id=${BANK_ID:}
payment.bank.account-no=${BANK_ACCOUNT_NO:}
payment.bank.account-name=${BANK_ACCOUNT_NAME:}
payment.bank.template=${BANK_QR_TEMPLATE:compact2}

# VNPay Sandbox.
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}

# MoMo Test.
payment.momo.partner-code=${MOMO_PARTNER_CODE:}
payment.momo.access-key=${MOMO_ACCESS_KEY:}
payment.momo.secret-key=${MOMO_SECRET_KEY:}
payment.momo.create-url=${MOMO_CREATE_URL:https://test-payment.momo.vn/v2/gateway/api/create}

# Trợ lý AI. Mặc định dùng bộ trả lời nội bộ, không cần API key.
# Provider hỗ trợ: local, openai, openai-compatible, gemini, anthropic.
# Với openai-compatible, AI_BASE_URL là bắt buộc (ví dụ URL v1 của Ollama/Groq/OpenRouter).
ai.provider=${AI_PROVIDER:local}
ai.model=${AI_MODEL:}
ai.api-key=${AI_API_KEY:}
ai.base-url=${AI_BASE_URL:}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:25}
ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:600}
ai.temperature=${AI_TEMPERATURE:0.35}
ai.rate-limit-per-minute=${AI_RATE_LIMIT_PER_MINUTE:20}
ai.max-history-messages=${AI_MAX_HISTORY_MESSAGES:8}
