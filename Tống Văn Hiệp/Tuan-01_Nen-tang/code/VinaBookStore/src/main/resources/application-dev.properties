# Profile phát triển local. Các giá trị mặc định chỉ được phép dùng trên máy dev.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/book?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# JWT secret cần cấu hình qua biến môi trường JWT_SECRET.
bezkoder.app.jwtSecret=${JWT_SECRET}
