# Production không có credential mặc định: ứng dụng dừng khởi động nếu thiếu biến.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema production phải được migrate có chủ đích, Hibernate chỉ kiểm tra.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

bezkoder.app.jwtSecret=${JWT_SECRET}

# URL tuyệt đối dùng để tạo redirect/callback thanh toán.
payment.frontend-url=${FRONTEND_URL}
payment.backend-url=${BACKEND_PUBLIC_URL}
