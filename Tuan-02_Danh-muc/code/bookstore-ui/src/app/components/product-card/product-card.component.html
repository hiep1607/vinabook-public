<article class="product-card">

  <div class="discount-badge" *ngIf="product.discount > 0">
    -{{ product.discount }}%
  </div>

  <div class="product-image">

    <a
      [attr.href]="'/product/' + product.id"
      [attr.aria-label]="'Xem ' + product.name"
      (click)="goToDetail($event)"
    >

    <img
      [src]="product.image"
      [alt]="product.name"
      loading="lazy"
      decoding="async"
      width="270"
      height="360"
      (error)="restoreOriginalCover($event)"
    />
    </a>

    <!-- WISHLIST TOGGLE -->

    <button
      class="wishlist-btn"
      [class.active]="isWishlisted"
      (click)="toggleWishlist($event)"
      [title]="isWishlisted ? 'Xóa khỏi yêu thích' : 'Thêm vào yêu thích'"
      [attr.aria-label]="isWishlisted ? 'Xóa khỏi yêu thích' : 'Thêm vào yêu thích'"
    >
      <lucide-icon name="heart" [attr.fill]="isWishlisted ? 'currentColor' : 'none'"></lucide-icon>
    </button>

  </div>

  <div class="product-info">

    <h3 class="product-title">
      <a [attr.href]="'/product/' + product.id" (click)="goToDetail($event)">{{ product.name }}</a>
    </h3>

    <p class="product-author">
      {{ product.author }}
    </p>

    <div class="product-rating" *ngIf="displayCount > 0">

      <span class="stars">{{ displayStars(displayRating) }}</span>

      <span>
        ({{ displayCount }} đánh giá)
      </span>

    </div>

    <div class="product-rating no-rating" *ngIf="displayCount === 0">
      Chưa có đánh giá
    </div>

    <div class="product-price">

      <span class="new-price">
        {{ product.price.toLocaleString('vi-VN') }}đ
      </span>

      <span class="old-price" *ngIf="product.discount > 0">
        {{ product.oldPrice.toLocaleString('vi-VN') }}đ
      </span>

      <!-- ADD TO CART -->

      <button
        type="button"
        class="add-cart-btn"
        (click)="addToCart($event)"
        title="Thêm vào giỏ hàng"
        aria-label="Thêm vào giỏ hàng"
      >
        <lucide-icon name="shopping-cart"></lucide-icon>
      </button>

    </div>

  </div>

</article>
